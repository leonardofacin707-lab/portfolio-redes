# Pi-hole: bloqueador de anuncios para a rede inteira, via DNS.
# Documentacao oficial: https://docs.pi-hole.net/docker/
#
# Antes de subir:
#   1. Copie .env.example para .env e troque a senha.
#   2. docker compose up -d
#   3. Abra http://localhost:8080/admin

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"     # DNS
      - "53:53/udp"     # DNS
      - "8080:80/tcp"   # painel web (8080 para nao brigar com outros sites na porta 80)
    environment:
      TZ: "America/Sao_Paulo"
      # Senha do painel, lida do arquivo .env (que NAO vai para o GitHub)
      FTLCONF_webserver_api_password: "${PIHOLE_SENHA:?Crie o arquivo .env com PIHOLE_SENHA}"
      # Aceita consultas vindas de outros aparelhos da rede, nao so deste computador
      FTLCONF_dns_listeningMode: "all"
    volumes:
      # Guarda configuracoes e listas fora do conteiner, para nao perder ao atualizar
      - "./etc-pihole:/etc/pihole"
    restart: unless-stopped
